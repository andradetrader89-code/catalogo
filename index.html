<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    :root{--bg-main:#0b1329;--bg-card:#152238;--bg-input:#0e172a;--border-color:#263859;--text-main:#f8fafc;--text-muted:#94a3b8;--accent-green:#10b981;--accent-blue:#38bdf8;--accent-red:#ef4444}
    body{background:var(--bg-main);color:var(--text-main);padding-top:78px;padding-bottom:60px;line-height:1.5}
    .top-bar{position:fixed;top:0;left:0;right:0;height:68px;background:rgba(11,19,41,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color);z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
    .top-bar h1{font-size:1.1rem;font-weight:800;color:#fff}
    .top-bar p{font-size:0.75rem;color:var(--text-muted)}
    .btn-cart{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:10px 16px;border-radius:24px;font-size:0.88rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px}
    .cart-badge{background:#fff;color:#059669;font-size:0.8rem;font-weight:900;padding:2px 8px;border-radius:12px}
    .container{max-width:1280px;margin:0 auto;padding:14px}
    .cat-label{font-size:0.75rem;font-weight:800;text-transform:uppercase;color:var(--accent-blue);margin-bottom:8px}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
    .tab{white-space:nowrap;padding:10px 16px;border-radius:12px;font-size:0.88rem;font-weight:800;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:8px}
    .tab.active{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border-color:var(--accent-blue)}
    .tab-count{background:rgba(0,0,0,0.35);color:#fff;font-size:0.75rem;padding:2px 7px;border-radius:10px}
    .search-box{background:var(--bg-card);border:1px solid #0284c7;border-radius:14px;padding:12px;margin-bottom:18px}
    .search-wrap{position:relative;display:flex;align-items:center}
    .search-input{width:100%;padding:12px 76px 12px 38px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;color:#fff;font-size:0.95rem;outline:none}
    .search-icon{position:absolute;left:12px;color:var(--text-muted);pointer-events:none}
    .btn-clear{position:absolute;right:10px;background:#263859;color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:0.76rem;font-weight:700;cursor:pointer;display:none}
    .search-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:0.8rem;color:var(--text-muted)}
    .counter-pill{color:var(--accent-blue);font-weight:800;background:rgba(56,189,248,0.12);padding:2px 10px;border-radius:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
    .badge{display:inline-block;font-size:0.7rem;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-bottom:6px;width:fit-content}
    .b-farmacia{background:rgba(16,185,129,0.15);color:#34d399}
    .b-king{background:rgba(251,191,36,0.15);color:#fbbf24}
    .b-lander{background:rgba(56,189,248,0.15);color:#38bdf8}
    .b-novax{background:rgba(192,132,252,0.15);color:#c084fc}
    .card-title{font-size:0.98rem;font-weight:800;color:#fff;line-height:1.35}
    .desc-box{background:rgba(14,23,42,0.75);border-left:3px solid var(--accent-blue);border-radius:0 8px 8px 0;padding:9px 11px}
    .desc-label{font-size:0.7rem;font-weight:800;text-transform:uppercase;color:var(--accent-blue);margin-bottom:3px}
    .card-desc{font-size:0.84rem;color:#cbd5e1}
    .opts-box{background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
    .opt-row{display:flex;flex-direction:column;gap:6px}
    .opt-row:not(:last-child){border-bottom:1px dashed var(--border-color);padding-bottom:8px}
    .opt-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .opt-name{font-size:0.78rem;font-weight:700;color:var(--text-muted)}
    .opt-price{font-size:0.96rem;font-weight:900;color:var(--accent-green)}
    .btn-add{width:100%;padding:8px 10px;background:rgba(56,189,248,0.12);color:var(--accent-blue);border:1px solid rgba(56,189,248,0.35);border-radius:8px;font-size:0.82rem;font-weight:800;cursor:pointer}
    .qty-box{display:flex;align-items:center;justify-content:space-between;background:#1c2d4a;border:1px solid var(--accent-green);border-radius:8px;overflow:hidden}
    .qty-btn{background:none;border:none;color:#fff;padding:6px 14px;font-size:0.95rem;font-weight:900;cursor:pointer}
    .qty-txt{font-size:0.84rem;font-weight:800;color:#34d399}
    .empty{grid-column:1/-1;text-align:center;padding:44px 18px;color:var(--text-muted);background:var(--bg-card);border:1px dashed var(--border-color);border-radius:14px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal.hidden{display:none}
    .modal-box{background:var(--bg-card);border:1px solid var(--border-color);border-radius:18px;width:100%;max-width:500px;max-height:88vh;display:flex;flex-direction:column}
    .modal-head{padding:15px 18px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
    .modal-head h3{font-size:1.05rem;font-weight:800;color:#fff}
    .btn-x{background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer}
    .modal-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
    .cart-row{background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .cart-title{font-size:0.88rem;font-weight:800;color:#fff}
    .cart-sub{font-size:0.78rem;color:var(--accent-blue);font-weight:700}
    .btn-del{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:var(--accent-red);border-radius:7px;padding:5px 9px;cursor:pointer}
    .input-name{width:100%;padding:11px 12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;color:#fff;font-size:0.92rem;outline:none}
    .total-box{background:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
    .total-val{font-size:1.25rem;font-weight:900;color:var(--accent-green)}
    .modal-foot{padding:14px 18px;border-top:1px solid var(--border-color)}
    .btn-send{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:12px;font-size:0.92rem;font-weight:900;cursor:pointer}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#10b981;color:#fff;padding:10px 22px;border-radius:24px;font-size:0.86rem;font-weight:800;transition:transform 0.25s ease;z-index:2000}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <header class="top-bar">
    <div>
      <h1>📦 Catálogo de Produtos</h1>
      <p>Consulte e monte seu pedido</p>
    </div>
    <button class="btn-cart" onclick="openCart()">
      <span>🛍️ Meu Pedido</span>
      <span id="cartBadge" class="cart-badge">0</span>
    </button>
  </header>

  <div class="container">
    <div class="cat-label">🏷️ MARCA OU CATEGORIA</div>
    <div id="tabs" class="tabs"></div>

    <div class="search-box">
      <div class="search-wrap">
        <span class="search-icon">🔎</span>
        <input id="search" type="search" class="search-input" oninput="render()" placeholder="Buscar por nome, marca ou para que serve...">
        <button id="btnClear" class="btn-clear" onclick="clearSearch()">✕ Limpar</button>
      </div>
      <div class="search-meta">
        <span>Busca no catálogo</span>
        <span id="counter" class="counter-pill">29 itens</span>
      </div>
    </div>

    <main id="grid" class="grid"></main>
    <div id="empty" class="empty" style="display:none;">Nenhum produto encontrado com esse nome.</div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>🛍️ Resumo do Seu Pedido</h3>
        <button class="btn-x" onclick="closeCart()">✕</button>
      </div>
      <div class="modal-body">
        <div id="cartList"></div>
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:800;color:var(--text-muted);margin-bottom:5px;">SEU NOME (OPCIONAL):</label>
          <input id="custName" type="text" class="input-name" placeholder="ex: Marcos Silva">
        </div>
        <div class="total-box">
          <span style="font-size:0.82rem;font-weight:700;color:var(--text-muted);">VALOR TOTAL ESTIMADO:</span>
          <span id="cartTotal" class="total-val">R$ 0,00</span>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-send" onclick="sendWhatsApp()">📋 COPIAR PEDIDO E ENVIAR NO WHATSAPP</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">✓ Pedido copiado!</div>

  <script>
    const PRODUCTS = [
      {id:"1",category:"Farmácia",name:"Roacutam 20mg (30cp)",desc:"Tratamento eficaz para acne severa e cravos resistentes; reduz acentuadamente a oleosidade da pele e previne cicatrizes.",options:[{label:"Caixa (30cp)",price:"R$ 210,00",numPrice:210}]},
      {id:"2",category:"Farmácia",name:"Sibutramina 15mg (30cp)",desc:"Auxilia no controle do apetite e no aumento da sensação de saciedade, facilitando a adesão a dietas de emagrecimento.",options:[{label:"Caixa (30cp)",price:"R$ 110,00",numPrice:110}]},
      {id:"3",category:"Farmácia",name:"Tadala Eurofarma 20mg (4cp)",desc:"Vasodilatador de ação rápida para melhoria da circulação e firmeza sob demanda pontual.",options:[{label:"Caixa (4cp)",price:"R$ 25,00",numPrice:25}]},
      {id:"4",category:"Farmácia",name:"Tadala Eurofarma 5mg (30cp)",desc:"Uso diário contínuo para suporte vascular, melhora do pump no treino e disposição física constante.",options:[{label:"Caixa (30cp)",price:"R$ 25,00",numPrice:25}]},
      {id:"5",category:"Farmácia",name:"Venvanse Lispax 30mg (5 cartelas de 6cp = 30cp)",desc:"Estimulante central para foco elevado, atenção sustentada, clareza mental e alto desempenho cognitivo nas tarefas diárias.",options:[{label:"Caixa (30cp)",price:"R$ 410,00",numPrice:410},{label:"Cartela (6cp)",price:"R$ 100,00",numPrice:100},{label:"Unidade (1cp)",price:"R$ 30,00",numPrice:30}]},
      {id:"6",category:"Farmácia",name:"Venvanse Lispax 50mg (5 cartelas de 6cp = 30cp)",desc:"Dosagem intermediária para concentração prolongada, alerta contínuo e alta produtividade nos estudos ou trabalho de alta exigência.",options:[{label:"Caixa (30cp)",price:"R$ 490,00",numPrice:490},{label:"Cartela (6cp)",price:"R$ 120,00",numPrice:120},{label:"Unidade (1cp)",price:"R$ 45,00",numPrice:45}]},
      {id:"7",category:"Farmácia",name:"Venvanse Cooper Manipulado 30mg (pote 30 caps)",desc:"Fórmula manipulada em cápsulas para melhoria do foco, redução da dispersão e suporte ao rendimento intelectual.",options:[{label:"Pote (30 caps)",price:"R$ 410,00",numPrice:410},{label:"Cápsula (1 cap)",price:"R$ 25,00",numPrice:25}]},
      {id:"8",category:"Farmácia",name:"Venvanse Cooper Manipulado 70mg (pote 30 caps)",desc:"Alta dosagem para performance cognitiva avançada, resposta rápida e sustentação intensa em rotinas exigentes.",options:[{label:"Pote (30 caps)",price:"R$ 530,00",numPrice:530},{label:"Cápsula (1 cap)",price:"R$ 30,00",numPrice:30}]},
      {id:"9",category:"Novax",name:"PT-141 (10mg + 2ml Água Bac)",desc:"Peptídeo voltado ao estímulo do desejo e da resposta sexual com ação central (até 10 aplicações fracionadas).",options:[{label:"Frasco",price:"R$ 550,00",numPrice:550},{label:"Aplicação / Dose",price:"R$ 100,00",numPrice:100}]},
      {id:"10",category:"Farmácia",name:"Finasterida 1mg (30cp)",desc:"Inibidor da 5-alfa-redutase para prevenção da queda capilar androgenética.",options:[{label:"Caixa (30cp)",price:"R$ 45,00",numPrice:45}]},
      {id:"11",category:"Farmácia",name:"Minoxidil 5% (60ml)",desc:"Solução tópica vasodilatadora para estímulo do crescimento capilar.",options:[{label:"Frasco (60ml)",price:"R$ 65,00",numPrice:65}]},
      {id:"12",category:"Farmácia",name:"Melatonina 5mg (60cp)",desc:"Suporte para regulação do ciclo do sono e recuperação noturna.",options:[{label:"Frasco (60cp)",price:"R$ 55,00",numPrice:55}]},
      {id:"13",category:"King",name:"Enantato de Testosterona King",desc:"Éster de meia-vida prolongada para suporte hormonal e ganho de força e massa.",options:[{label:"Bujao 10ml",price:"R$ 180,00",numPrice:180}]},
      {id:"14",category:"King",name:"Decanoato de Nandrolona King",desc:"Composto anabólico voltado a ganhos sólidos e conforto articular.",options:[{label:"Bujao 10ml",price:"R$ 190,00",numPrice:190}]},
      {id:"15",category:"King",name:"Boldenona Undecilenato King",desc:"Auxilia no ganho gradual de massa magra, vascularização e apetite.",options:[{label:"Bujao 10ml",price:"R$ 185,00",numPrice:185}]},
      {id:"16",category:"King",name:"Trembolona Acetato King",desc:"Composto potente para densidade muscular e definição em fases avançadas.",options:[{label:"Bujao 10ml",price:"R$ 220,00",numPrice:220}]},
      {id:"17",category:"King",name:"Masteron Propionato King",desc:"Favorece aspecto seco, rigidez muscular e definição.",options:[{label:"Bujao 10ml",price:"R$ 210,00",numPrice:210}]},
      {id:"18",category:"King",name:"Stanozolol Injetável King",desc:"Voltado para qualidade muscular, força e redução de retenção.",options:[{label:"Bujao 10ml",price:"R$ 175,00",numPrice:175}]},
      {id:"19",category:"King",name:"Oxandrolona 10mg King",desc:"Opção oral associada a ganhos limpos e preservação de massa magra.",options:[{label:"Pote (100cp)",price:"R$ 210,00",numPrice:210}]},
      {id:"20",category:"King",name:"Dianabol 10mg King",desc:"Composto oral de ação rápida para força e volume inicial.",options:[{label:"Pote (100cp)",price:"R$ 140,00",numPrice:140}]},
      {id:"21",category:"Lander",name:"Durateston Landerlan",desc:"Blend de quatro ésteres de testosterona para liberação gradual.",options:[{label:"Bujao",price:"R$ 195,00",numPrice:195}]},
      {id:"22",category:"Lander",name:"Deposteron / Cipionato Landerlan",desc:"Éster de ação prolongada para estabilidade hormonal.",options:[{label:"Bujao",price:"R$ 185,00",numPrice:185}]},
      {id:"23",category:"Lander",name:"Deca Landerlan",desc:"Suporte anabólico clássico para volume e recuperação.",options:[{label:"Bujao",price:"R$ 190,00",numPrice:190}]},
      {id:"24",category:"Lander",name:"Equipoise / Boldenona Landerlan",desc:"Promove ganhos consistentes e melhora do aspecto físico.",options:[{label:"Bujao",price:"R$ 185,00",numPrice:185}]},
      {id:"25",category:"Lander",name:"Stanozolol Landerlan",desc:"Foco em definição, firmeza e força.",options:[{label:"Bujao",price:"R$ 175,00",numPrice:175}]},
      {id:"26",category:"Lander",name:"Oxandrolona Landerlan",desc:"Comprimidos voltados a qualidade muscular e definição.",options:[{label:"Frasco",price:"R$ 220,00",numPrice:220}]},
      {id:"27",category:"Lander",name:"Clenbuterol Landerlan",desc:"Termogênico beta-2 agonista para auxílio em fases de cutting.",options:[{label:"Frasco",price:"R$ 120,00",numPrice:120}]},
      {id:"28",category:"Lander",name:"HCG Landerlan",desc:"Gonadotrofina coriônica humana utilizada em protocolos específicos.",options:[{label:"Caixa",price:"R$ 240,00",numPrice:240}]},
      {id:"29",category:"Lander",name:"Enantato de Testosterona Landerlan",desc:"Testosterona de liberação sustentada para base de protocolo, força e massa muscular.",options:[{label:"Bujao 10ml",price:"R$ 230,00",numPrice:230}]}
    ];

    const CATEGORIES = ["Todos", "Farmácia", "King", "Lander", "Novax"];
    let activeCat = "Todos";
    let cart = [];

    function badgeClass(cat) {
      if (cat === "Farmácia") return "b-farmacia";
      if (cat === "King") return "b-king";
      if (cat === "Lander") return "b-lander";
      return "b-novax";
    }

    function escapeAttr(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    function renderTabs() {
      const box = document.getElementById("tabs");
      box.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const total = cat === "Todos" ? PRODUCTS.length : PRODUCTS.filter(p => p.category === cat).length;
        const btn = document.createElement("button");
        btn.className = "tab" + (activeCat === cat ? " active" : "");
        btn.innerHTML = `<span>${cat}</span><span class="tab-count">${total}</span>`;
        btn.onclick = () => { activeCat = cat; render(); };
        box.appendChild(btn);
      });
    }

    function getQty(id, label) {
      const item = cart.find(i => i.id === id && i.label === label);
      return item ? item.qty : 0;
    }

    function addItem(id, name, label, price, numPrice) {
      const item = cart.find(i => i.id === id && i.label === label);
      if (item) { item.qty += 1; }
      else { cart.push({ id, name, label, price, numPrice, qty: 1 }); }
      updateBadge();
      render();
    }

    function changeQty(id, label, delta) {
      const idx = cart.findIndex(i => i.id === id && i.label === label);
      if (idx !== -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        updateBadge();
        render();
        if (!document.getElementById("modal").classList.contains("hidden")) renderCart();
      }
    }

    function updateBadge() {
      const total = cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById("cartBadge").textContent = total;
    }

    function clearSearch() {
      document.getElementById("search").value = "";
      document.getElementById("btnClear").style.display = "none";
      render();
    }

    function render() {
      renderTabs();
      const q = (document.getElementById("search").value || "").trim().toLowerCase();
      document.getElementById("btnClear").style.display = q ? "block" : "none";

      const list = PRODUCTS.filter(p => {
        const matchCat = activeCat === "Todos" || p.category === activeCat;
        const matchText = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
        return matchCat && matchText;
      });

      document.getElementById("counter").textContent = `${list.length} ${list.length === 1 ? "item" : "itens"}`;
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      grid.innerHTML = "";

      if (list.length === 0) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      list.forEach(p => {
        const card = document.createElement("article");
        card.className = "card";

        const optsHtml = p.options.map(op => {
          const qty = getQty(p.id, op.label);
          const sName = escapeAttr(p.name);
          const sLabel = escapeAttr(op.label);
          const sPrice = escapeAttr(op.price);
          const ctrl = qty > 0
            ? `<div class="qty-box"><button class="qty-btn" onclick="changeQty('${p.id}','${sLabel}',-1)">-</button><span class="qty-txt">${qty} no pedido</span><button class="qty-btn" onclick="changeQty('${p.id}','${sLabel}',1)">+</button></div>`
            : `<button class="btn-add" onclick="addItem('${p.id}','${sName}','${sLabel}','${sPrice}',${op.numPrice})">+ Adicionar ao pedido</button>`;
          return `<div class="opt-row"><div class="opt-top"><span class="opt-name">${op.label}</span><span class="opt-price">${op.price}</span></div>${ctrl}</div>`;
        }).join("");

        card.innerHTML = `
          <div>
            <span class="badge ${badgeClass(p.category)}">${p.category}</span>
            <h2 class="card-title">${p.name}</h2>
            <div class="desc-box" style="margin-top:10px;">
              <div class="desc-label">Para que serve</div>
              <p class="card-desc">${p.desc}</p>
            </div>
          </div>
          <div class="opts-box">${optsHtml}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openCart() {
      renderCart();
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeCart() {
      document.getElementById("modal").classList.add("hidden");
    }

    function renderCart() {
      const box = document.getElementById("cartList");
      if (cart.length === 0) {
        box.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:18px;">Seu pedido está vazio.</div>';
        document.getElementById("cartTotal").textContent = "R$ 0,00";
        return;
      }
      let total = 0;
      box.innerHTML = cart.map(item => {
        total += item.numPrice * item.qty;
        const sLabel = escapeAttr(item.label);
        return `<div class="cart-row"><div><div class="cart-title">${item.qty}x ${item.name}</div><div class="cart-sub">${item.label} • ${item.price}</div></div><button class="btn-del" onclick="changeQty('${item.id}','${sLabel}',-${item.qty})">✕</button></div>`;
      }).join("");
      document.getElementById("cartTotal").textContent = total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    function sendWhatsApp() {
      if (cart.length === 0) { showToast("Adicione pelo menos 1 item."); return; }
      const name = document.getElementById("custName").value.trim();
      let total = 0;
      const lines = cart.map(item => {
        total += item.numPrice * item.qty;
        return `• ${item.qty}x ${item.name} (${item.label}) - ${item.price}`;
      });
      const text = [
        name ? `Olá! Meu nome é ${name}. Gostaria de fazer este pedido:` : "Olá! Gostaria de fazer este pedido:",
        ...lines,
        `Total estimado: ${total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}`
      ].join("\n");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      showToast("✓ Pedido copiado!");
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }

    render();
  </script>
</body>
</html>
