<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    :root{--bg-main:#0b1329;--bg-card:#152238;--bg-card-hover:#1c2d4a;--bg-input:#0e172a;--border-color:#263859;--border-highlight:#38bdf8;--text-main:#f8fafc;--text-muted:#94a3b8;--accent-green:#10b981;--accent-blue:#38bdf8;--accent-red:#ef4444}
    body{background-color:var(--bg-main);color:var(--text-main);padding-top:76px;padding-bottom:60px;line-height:1.5}
    .top-bar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(11,19,41,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color);z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
    .top-bar-title h1{font-size:1.15rem;font-weight:800;color:#fff}
    .top-bar-title p{font-size:0.75rem;color:var(--text-muted)}
    .btn-cart-header{background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:#fff;border:none;padding:10px 18px;border-radius:24px;font-size:0.9rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px}
    .cart-badge{background:#fff;color:#059669;font-size:0.82rem;font-weight:900;padding:2px 8px;border-radius:12px}
    .container{max-width:1280px;margin:0 auto;padding:14px}
    .categories-section{margin-bottom:16px}
    .categories-label{font-size:0.75rem;font-weight:800;text-transform:uppercase;color:#38bdf8;margin-bottom:8px}
    .tabs-wrapper{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
    .tabs-wrapper::-webkit-scrollbar{display:none}
    .tab-pill{white-space:nowrap;padding:11px 18px;border-radius:14px;font-size:0.9rem;font-weight:800;background:var(--bg-card);border:2px solid var(--border-color);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:8px}
    .tab-pill.active{background:linear-gradient(135deg,#0284c7 0%,#0369a1 100%);color:#fff;border-color:#38bdf8}
    .tab-count{font-size:0.75rem;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.35);color:#fff}
    .search-box{background:linear-gradient(135deg,#152238 0%,#0b1329 100%);border:2px solid #0284c7;border-radius:16px;padding:14px;margin-bottom:20px}
    .search-input-wrapper{position:relative;display:flex;align-items:center}
    .search-input{width:100%;padding:14px 44px 14px 42px;background-color:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;color:#fff;font-size:0.95rem;font-weight:600;outline:none}
    .search-icon-left{position:absolute;left:14px;font-size:1.1rem;color:var(--text-muted);pointer-events:none}
    .btn-clear{position:absolute;right:12px;background:#263859;border:none;color:#f1f5f9;border-radius:6px;padding:6px 10px;font-size:0.78rem;font-weight:700;cursor:pointer;display:none}
    .search-counter{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:0.8rem;color:var(--text-muted)}
    .counter-badge{font-weight:800;color:var(--accent-blue);background:rgba(56,189,248,0.12);padding:3px 10px;border-radius:12px}
    .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    @media(max-width:900px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:580px){.product-grid{grid-template-columns:1fr}}
    .card{background-color:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
    .card-header-info{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .brand-badge{display:inline-block;font-size:0.7rem;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;width:fit-content}
    .badge-farmacia{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3)}
    .badge-king{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
    .badge-lander{background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)}
    .badge-novax{background:rgba(192,132,252,0.15);color:#c084fc;border:1px solid rgba(192,132,252,0.3)}
    .card-title{font-size:0.98rem;font-weight:800;color:#fff;line-height:1.35}
    .desc-box{background-color:rgba(14,23,42,0.7);border-left:3px solid var(--accent-blue);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:14px}
    .desc-title{font-size:0.72rem;font-weight:800;text-transform:uppercase;color:var(--accent-blue);margin-bottom:4px}
    .card-desc{font-size:0.84rem;color:#cbd5e1;line-height:1.4}
    .price-box{background-color:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:10px 12px;margin-top:auto}
    .price-option-row{display:flex;flex-direction:column;gap:6px;padding:6px 0}
    .price-option-row:not(:last-child){border-bottom:1px dashed var(--border-color);margin-bottom:6px;padding-bottom:8px}
    .opt-info{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .opt-label{font-size:0.78rem;color:var(--text-muted);font-weight:700}
    .opt-price{font-size:0.98rem;font-weight:900;color:var(--accent-green)}
    .btn-add-interest{width:100%;padding:9px 12px;background-color:rgba(56,189,248,0.12);color:var(--accent-blue);border:1px solid rgba(56,189,248,0.35);border-radius:10px;font-size:0.82rem;font-weight:800;cursor:pointer}
    .qty-controls{display:flex;align-items:center;justify-content:space-between;background:#1c2d4a;border:1px solid var(--accent-green);border-radius:10px;overflow:hidden;width:100%}
    .qty-btn{background:none;border:none;color:#fff;padding:6px 14px;font-size:0.95rem;font-weight:900;cursor:pointer}
    .qty-val{font-size:0.85rem;font-weight:800;color:#34d399}
    .empty-msg{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-muted);background:var(--bg-card);border-radius:16px;border:1px dashed var(--border-color)}
    .modal-overlay{position:fixed;inset:0;background-color:rgba(0,0,0,0.88);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-overlay.hidden{display:none}
    .modal-card{background-color:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column}
    .modal-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
    .modal-title{font-size:1.1rem;font-weight:800;color:#fff}
    .btn-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer}
    .modal-body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
    .cart-item-row{background-color:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .cart-item-info{display:flex;flex-direction:column;gap:3px;flex:1}
    .cart-item-name{font-size:0.88rem;font-weight:800;color:#fff}
    .cart-item-opt{font-size:0.78rem;color:var(--accent-blue);font-weight:700}
    .btn-remove{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:var(--accent-red);border-radius:8px;padding:6px 10px;font-size:0.82rem;cursor:pointer}
    .customer-input-group{display:flex;flex-direction:column;gap:6px;margin-top:6px}
    .customer-label{font-size:0.75rem;font-weight:800;color:var(--text-muted);text-transform:uppercase}
    .customer-input{width:100%;padding:12px 14px;background-color:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;color:#fff;font-size:0.95rem;outline:none}
    .cart-total-box{background:linear-gradient(135deg,#0f172a 0%,#060a12 100%);border:1px solid var(--border-color);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
    .total-label{font-size:0.82rem;color:var(--text-muted);font-weight:700}
    .total-val{font-size:1.35rem;font-weight:900;color:var(--accent-green)}
    .modal-footer{padding:16px 20px;border-top:1px solid var(--border-color)}
    .btn-copy-big{width:100%;padding:16px;background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:#fff;border:none;border-radius:14px;font-size:0.95rem;font-weight:900;cursor:pointer;text-transform:uppercase}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#10b981;color:#fff;padding:12px 24px;border-radius:30px;font-size:0.88rem;font-weight:800;transition:transform 0.3s ease;z-index:2000;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-title">
      <h1>📦 Catálogo de Produtos</h1>
      <p>Consulte e monte seu pedido</p>
    </div>
    <button class="btn-cart-header" onclick="openCartModal()">
      <span>🛍️ Meu Pedido</span>
      <span id="headerCartBadge" class="cart-badge">0</span>
    </button>
  </div>

  <div class="container">
    <div class="categories-section">
      <div class="categories-label">🏷️ MARCA OU CATEGORIA</div>
      <div class="tabs-wrapper" id="tabsContainer"></div>
    </div>

    <div class="search-box">
      <div class="search-input-wrapper">
        <span class="search-icon-left">🔎</span>
        <input type="search" id="searchInput" class="search-input" oninput="render()" placeholder="Buscar por nome, marca ou para que serve...">
        <button id="btnClear" class="btn-clear" onclick="clearSearch()">✕ Limpar</button>
      </div>
      <div class="search-counter">
        <span>Busca no catálogo</span>
        <span id="counterBadge" class="counter-badge">29 itens</span>
      </div>
    </div>

    <main class="product-grid" id="productGrid"></main>
    <div id="emptyState" class="empty-msg" style="display:none;">Nenhum produto encontrado com esse nome. Tente apagar a busca ou selecionar outra aba acima.</div>
  </div>

  <div id="cartModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">🛍️ Resumo do Seu Pedido</h3>
        <button class="btn-close" onclick="closeCartModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="cartItemsList"></div>
        <div class="customer-input-group">
          <label class="customer-label">Seu Nome (Opcional):</label>
          <input type="text" id="customerName" class="customer-input" placeholder="ex: Marcos Silva">
        </div>
        <div class="cart-total-box">
          <span class="total-label">VALOR TOTAL ESTIMADO:</span>
          <span id="cartTotalVal" class="total-val">R$ 0,00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-copy-big" onclick="copyAndDirectWhatsApp()">📋 COPIAR PEDIDO E ENVIAR NO WHATSAPP</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">✓ Pedido copiado com sucesso!</div>
