<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Catálogo de Produtos — Clientes</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}body{background:#0b0f19;color:#f8fafc;padding:12px;padding-bottom:92px}.wrap{max-width:1120px;margin:0 auto}.hdr{background:#121b2e;border:1px solid #24324d;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;font-weight:800;color:#34d399;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.35);padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:4px}h1{font-size:20px;font-weight:800}.sub{font-size:12px;color:#94a3b8;margin-top:2px}.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:12px;font-weight:700;background:#0b1220;border:1px solid #24324d;padding:7px 11px;border-radius:9px}.btn1{background:#10b981;color:#052e16;border:0;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer}.btn1:disabled{opacity:.45;cursor:not-allowed}.btn2{background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer}.inp{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #334155;background:#111827;color:#fff;font-size:14px;margin-bottom:10px;outline:none}.inp:focus{border-color:#10b981}.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}.cbtn{padding:6px 13px;border-radius:999px;border:1px solid #334155;background:#151d30;color:#cbd5e1;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.cbtn.on{background:#10b981;border-color:#10b981;color:#052e16}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}.card{background:#151d30;border:1px solid #24324d;border-radius:13px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}.card.sel{border-color:#10b981}.badge{font-size:10px;font-weight:800;text-transform:uppercase;color:#34d399;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.3);padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:5px}.ttl{font-size:15px;font-weight:800;color:#fff}.opts{display:flex;flex-direction:column;gap:6px;border-top:1px solid #24324d;padding-top:9px}.obtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0e1626;border:1px solid #263552;border-radius:8px;padding:8px 10px;font-size:12px;color:#f1f5f9;cursor:pointer;text-align:left}.obtn.on{background:rgba(16,185,129,.16);border-color:#10b981}.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid #64748b;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;margin-right:7px}.obtn.on .chk{background:#10b981;border-color:#10b981;color:#052e16}.prc{font-weight:800;color:#10b981;white-space:nowrap}.pnd{font-weight:700;color:#fbbf24;font-size:11px}.qrow{display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding:5px 8px;background:#090e1a;border:1px solid #1e293b;border-radius:7px;font-size:12px}.qctl{display:flex;align-items:center;gap:6px}.qbtn{width:22px;height:22px;border-radius:5px;border:1px solid #334155;background:#151d30;color:#fff;font-weight:800;cursor:pointer}.qval{min-width:18px;text-align:center;font-weight:800;color:#34d399}.bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;border-top:1px solid #24324d;padding:9px 12px;display:none;z-index:40}.bar.on{display:block}.bin{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}.bsum{font-size:13px}.bsum strong{color:#10b981;font-size:15px}.mbk{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;padding:12px;z-index:60}.mbk.on{display:flex}.mdl{width:100%;max-width:500px;background:#151d30;border:1px solid #334155;border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto}.ta{width:100%;min-height:180px;background:#0b1220;border:1px solid #24324d;border-radius:9px;padding:9px;color:#e2e8f0;font-size:12px}.tst{position:fixed;top:14px;right:14px;background:#10b981;color:#052e16;font-weight:800;font-size:12px;padding:9px 13px;border-radius:9px;display:none;z-index:80}.tst.on{display:block}</style></head><body><div class="tst" id="tst">Copiado para WhatsApp!</div><div class="wrap"><div class="hdr"><div><span class="tag">Atendimento &amp; Pedidos</span><h1>Catálogo de Produtos</h1><div class="sub" id="cnt">Carregando...</div></div><div class="acts"><div class="pill" id="tsel">0 selecionados</div><button class="btn1" id="tcop" onclick="openM()" disabled>Copiar para WhatsApp</button></div></div><input id="q" class="inp" type="search" placeholder="Buscar produto, dosagem ou categoria..." oninput="render()"/><div class="cats" id="cats"></div><div class="grid" id="grid"></div></div><div class="bar" id="bar"><div class="bin"><div class="bsum"><span id="bct">0 itens</span> • Estimado: <strong id="btot">R$ 0,00</strong></div><div class="acts"><button class="btn2" onclick="clr()">Limpar</button><button class="btn1" onclick="openM()">Copiar / Enviar WhatsApp</button></div></div></div><div class="mbk" id="mbk" onclick="clsM(event)"><div class="mdl" onclick="event.stopPropagation()"><div style="font-size:16px;font-weight:800">Resumo Selecionado para WhatsApp</div><div class="sub">Copie a mensagem pronta para colar no WhatsApp:</div><textarea class="ta" id="sum" readonly></textarea><div class="acts" style="justify-content:flex-end"><button class="btn2" onclick="clsM()">Fechar</button><button class="btn1" onclick="cpM()">Copiar Texto</button></div></div></div><script>const ITEMS=[{"id":"far-roacutam-20","cat":"Farmácia","name":"Roacutam 20mg (30cp)","options":[{"label":"Caixa (30cp)","priceText":"R$ 210,00","num":210,"pending":false}]},{"id":"far-sibutramina-15","cat":"Farmácia","name":"Sibutramina 15mg (30cp)","options":[{"label":"Caixa (30cp)","priceText":"R$ 110,00","num":110,"pending":false}]},{"id":"far-tadala-20","cat":"Farmácia","name":"Tadala Eurofarma 20mg (4cp)","options":[{"label":"Caixa / Cartela (4cp)","priceText":"R$ 25,00","num":25,"pending":false}]},{"id":"far-tadala-5","cat":"Farmácia","name":"Tadala Eurofarma 5mg (30cp)","options":[{"label":"Caixa (30cp)","priceText":"R$ 25,00","num":25,"pending":false}]},{"id":"far-venv-coop-30","cat":"Farmácia","name":"Venvanse Cooper Manipulado 30mg (30caps)","options":[{"label":"Pote (30caps)","priceText":"R$ 410,00","num":410,"pending":false}]},{"id":"far-venv-coop-70","cat":"Farmácia","name":"Venvanse Cooper Manipulado 70mg (30caps)","options":[{"label":"Pote (30caps)","priceText":"R$ 530,00","num":530,"pending":false}]},{"id":"far-venv-lisp-30","cat":"Farmácia","name":"Venvanse Lispax 30mg (30caps)","options":[{"label":"Caixa / Pote (30caps)","priceText":"R$ 410,00","num":410,"pending":false}]},{"id":"far-venv-lisp-50","cat":"Farmácia","name":"Venvanse Lispax 50mg (30caps)","options":[{"label":"Caixa / Pote (30caps)","priceText":"R$ 510,00","num":510,"pending":false}]},{"id":"far-finasterida-1","cat":"Farmácia","name":"Finasterida 1mg (30cp)","options":[{"label":"Caixa (30cp)","priceText":"R$ 60,00","num":60,"pending":false}]},{"id":"far-hgh-10","cat":"Farmácia","name":"HGH Kigtropin 10ui","options":[{"label":"Frasco (10 UI)","priceText":"R$ 75,00","num":75,"pending":false}]},{"id":"far-lipoless","cat":"Farmácia","name":"Lipoless","options":[{"label":"Kit / Apresentação","priceText":"R$ 1.150,00","num":1150,"pending":false}]},{"id":"far-lipostabil-5","cat":"Farmácia","name":"Lipostabil 5ML","options":[{"label":"Unidade (5 mL)","priceText":"R$ 60,00","num":60,"pending":false}]},{"id":"kp-deca-200","cat":"King Pharma","name":"Deca 10ML - 200mg","options":[{"label":"Frasco (10 mL)","priceText":"R$ 190,00","num":190,"pending":false}]},{"id":"kp-dianabol-10","cat":"King Pharma","name":"Dianabol 10mg (100cp)","options":[{"label":"Frasco / Caixa (100cp)","priceText":"R$ 145,00","num":145,"pending":false}]},{"id":"kp-durateston-250","cat":"King Pharma","name":"Durateston 250mg/ml","options":[{"label":"Frasco (10 mL)","priceText":"R$ 210,00","num":210,"pending":false}]},{"id":"kp-enantato-250","cat":"King Pharma","name":"Enantato 250mg/ml","options":[{"label":"Frasco (10 mL)","priceText":"R$ 180,00","num":180,"pending":false}]},{"id":"kp-hemogenin-20","cat":"King Pharma","name":"Hemogenin 50mg (20cp)","options":[{"label":"Caixa / Cartela (20cp)","priceText":"R$ 145,00","num":145,"pending":false}]},{"id":"kp-hemogenin-50","cat":"King Pharma","name":"Hemogenin 50mg (50cp)","options":[{"label":"Caixa / Cartela (50cp)","priceText":"R$ 220,00","num":220,"pending":false}]},{"id":"kp-masteron-100","cat":"King Pharma","name":"Masteron 100mg/ml","options":[{"label":"Frasco","priceText":"Sob consulta / Pendente","num":0,"pending":true}]},{"id":"kp-masteron-en-100","cat":"King Pharma","name":"Masteron Enantato 100mg/ml","options":[{"label":"Frasco (10 mL)","priceText":"R$ 275,00","num":275,"pending":false}]},{"id":"kp-masteron-oral-10","cat":"King Pharma","name":"Masteron Oral 10mg (50cp)","options":[{"label":"Frasco / Caixa (50cp)","priceText":"R$ 215,00","num":215,"pending":false}]},{"id":"kp-oxan-10","cat":"King Pharma","name":"Oxandrolona 10mg (50cp)","options":[{"label":"Frasco / Caixa (50cp)","priceText":"R$ 230,00","num":230,"pending":false}]},{"id":"kp-primo-100","cat":"King Pharma","name":"Primobolan 100mg/ml","options":[{"label":"Frasco (10 mL)","priceText":"R$ 420,00","num":420,"pending":false}]},{"id":"kp-trembo-ace-100","cat":"King Pharma","name":"Trembo Ace 10ML - 100mg","options":[{"label":"Frasco (10 mL)","priceText":"R$ 195,00","num":195,"pending":false}]},{"id":"ld-enantato-testo","cat":"Lander / Landerlan","name":"Enantato Testo","options":[{"label":"Frasco","priceText":"R$ 230,00","num":230,"pending":false}]},{"id":"ld-oxan-10-50","cat":"Lander / Landerlan","name":"Oxan 10mg (50comp)","options":[{"label":"Frasco / Caixa (50comp)","priceText":"R$ 300,00","num":300,"pending":false}]},{"id":"ld-oxan-5-100","cat":"Lander / Landerlan","name":"Oxan 5mg (100comp)","options":[{"label":"Frasco / Caixa (100comp)","priceText":"R$ 370,00","num:370,"pending":false}]},{"id":"ld-proviron-25","cat":"Lander / Landerlan","name":"Proviron 25mcg (20cp)","options":[{"label":"Caixa / Cartela (20cp)","priceText":"R$ 185,00","num":185,"pending":false}]},{"id":"ld-stano-oral-10","cat":"Lander / Landerlan","name":"Stano Oral 10mg (100cp)","options":[{"label":"Frasco / Caixa (100cp)","priceText":"R$ 165,00","num":165,"pending":false}]},{"id":"ld-dianabol-10","cat":"Lander / Landerlan","name":"Dianabol 10mg (100cp)","options":[{"label":"Frasco / Caixa (100cp)","priceText":"R$ 175,00","num":175,"pending":false}]},{"id":"ld-hemogenin-20","cat":"Lander / Landerlan","name":"Hemogenin 50mg (20cp)","options":[{"label":"Caixa / Cartela (20cp)","priceText":"R$ 175,00","num":175,"pending":false}]},{"id":"nv-pt141","cat":"Novax","name":"PT-141 (10mg + 2ml Água Bac)","options":[{"label":"Frasco / Kit Completo (10 mg + 2 mL)","priceText":"R$ 550,00","num":550,"pending":false},{"label":"Aplicação Fracionada / Dose (1 mg / 20 UI)","priceText":"R$ 100,00","num":100,"pending":false}]}];let cat="Todos";const sel=new Map();const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});function toast(m){const t=document.getElementById("tst");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2000)}function rCats(){const cs=["Todos",...new Set(ITEMS.map(x=>x.cat))];const e=document.getElementById("cats");e.innerHTML="";cs.forEach(c=>{const b=document.createElement("button");b.className="cbtn"+(c===cat?" on":"");b.textContent=c;b.onclick=()=>{cat=c;rCats();render()};e.appendChild(b)})}function tog(k){sel.has(k)?sel.delete(k):sel.set(k,1);upd();render()}function chg(k,d,ev){ev.stopPropagation();const n=(sel.get(k)||0)+d;n<=0?sel.delete(k):sel.set(k,n);upd();render()}function clr(){sel.clear();upd();render()}function det(){const out=[];for(const[k,q]of sel.entries()){const[id,i]=k.split("::");const it=ITEMS.find(x=>x.id===id);const op=it&&it.options[+i];if(op)out.push({it,op,q})}return out}function upd(){const l=det();const n=l.reduce((a,x)=>a+x.q,0);let tot=0,pnd=0;l.forEach(x=>{x.op.pending?pnd=1:tot+=x.op.num*x.q});document.getElementById("tsel").textContent=n===1?"1 selecionado":n+" selecionados";document.getElementById("tcop").disabled=!n;const b=document.getElementById("bar");if(!n){b.classList.remove("on")}else{b.classList.add("on");document.getElementById("bct").textContent=n===1?"1 item":n+" itens";document.getElementById("btot").textContent=brl(tot)+(pnd?" + sob consulta":"")}}function msg(){const l=det();if(!l.length)return"";const lines=["Olá! Gostaria de verificar/pedir os seguintes itens do catálogo:",""];let tot=0,pnd=0;l.forEach((x,i)=>{const u=x.op.pending?x.op.priceText:brl(x.op.num);const s=x.op.pending?"":" ("+brl(x.op.num*x.q)+")";x.op.pending?pnd=1:tot+=x.op.num*x.q;lines.push((i+1)+". ["+x.it.cat+"] "+x.it.name+" — "+x.op.label+" | Qtd: "+x.q+" | "+u+s)});lines.push("","Total estimado: "+brl(tot)+(pnd?" (há item sob consulta)":""));return lines.join("\n")}function openM(){const m=msg();if(!m)return;document.getElementById("sum").value=m;document.getElementById("mbk").classList.add("on")}function clsM(e){if(!e||e.target===e.currentTarget)document.getElementById("mbk").classList.remove("on")}async function cpM(){const t=document.getElementById("sum").value;if(!t)return;try{await navigator.clipboard.writeText(t)}catch(_){const a=document.getElementById("sum");a.focus();a.select();document.execCommand("copy")}toast("Resumo copiado! Agora é só colar no WhatsApp.")}function render(){const q=document.getElementById("q").value.trim().toLowerCase();const l=ITEMS.filter(x=>(cat==="Todos"||x.cat===cat)&&(!q||x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)||x.options.some(o=>o.label.toLowerCase().includes(q)||o.priceText.toLowerCase().includes(q))));document.getElementById("cnt").textContent="Exibindo "+l.length+" de "+ITEMS.length+" itens";document.getElementById("grid").innerHTML=l.length?l.map(x=>{const has=x.options.some((_,i)=>sel.has(x.id+"::"+i));const ops=x.options.map((o,i)=>{const k=x.id+"::"+i;const qv=sel.get(k)||0;const qb=qv?'<div class="qrow" onclick="event.stopPropagation()"><span>Quantidade:</span><div class="qctl"><button class="qbtn" onclick="chg(\''+k+'\',-1,event)">-</button><span class="qval">'+qv+'</span><button class="qbtn" onclick="chg(\''+k+'\',1,event)">+</button></div></div>':"";return'<div><button type="button" class="obtn'+(qv?" on":"")+'" onclick="tog(\''+k+'\')"><span><span class="chk">'+(qv?"✓":"")+'</span>'+o.label+'</span><span class="'+(o.pending?"pnd":"prc")+'">'+o.priceText+'</span></button>'+qb+'</div>'}).join("");return'<div class="card'+(has?" sel":"")+'"><div><span class="badge">'+x.cat+'</span><div class="ttl">'+x.name+'</div></div><div class="opts">'+ops+'</div></div>'}).join(""):'<div class="card"><div class="sub">Nenhum item encontrado.</div></div>'}rCats();upd();render();</script></body></html>
