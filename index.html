<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Catálogo de Produtos — Clientes</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}body{background:#0b0f19;color:#f8fafc;padding:14px;padding-bottom:96px;line-height:1.45;}.wrap{max-width:1140px;margin:0 auto;}.header{background:linear-gradient(135deg,#131c31 0%,#0f172a 100%);border:1px solid #24324d;border-radius:16px;padding:16px;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;}.brand-tag{display:inline-block;font-size:0.68rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#34d399;background:rgba(16,185,129,0.14);border:1px solid rgba(16,185,129,0.35);padding:3px 9px;border-radius:999px;margin-bottom:6px;}h1{font-size:1.3rem;font-weight:800;color:#ffffff;}.sub{font-size:0.8rem;color:#94a3b8;margin-top:2px;}.header-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}.pill-info{font-size:0.78rem;font-weight:700;color:#e2e8f0;background:#0b1220;border:1px solid #24324d;padding:8px 12px;border-radius:10px;}.btn-top-copy{background:#10b981;color:#052e16;border:none;border-radius:10px;padding:9px 14px;font-size:0.82rem;font-weight:800;cursor:pointer;}.btn-top-copy:disabled{opacity:0.45;cursor:not-allowed;}.search-box{margin-bottom:12px;}.search-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #334155;background:#111827;color:#fff;font-size:0.95rem;outline:none;}.search-input:focus{border-color:#10b981;}.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;}.cat-btn{padding:7px 14px;border-radius:999px;border:1px solid #334155;background:#151d30;color:#cbd5e1;font-size:0.78rem;font-weight:700;cursor:pointer;white-space:nowrap;}.cat-btn.active{background:#10b981;border-color:#10b981;color:#052e16;}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}.card{background:#151d30;border:1px solid #24324d;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;}.card.selected-card{border-color:#10b981;box-shadow:0 0 0 1px rgba(16,185,129,0.25);}.badge{display:inline-block;font-size:0.66rem;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:rgba(16,185,129,0.14);color:#34d399;border:1px solid rgba(16,185,129,0.3);margin-bottom:6px;}.title{font-size:1rem;font-weight:800;color:#fff;}.desc{font-size:0.8rem;color:#cbd5e1;margin-top:6px;line-height:1.45;}.opts{display:flex;flex-direction:column;gap:6px;border-top:1px solid #24324d;padding-top:10px;}.opt-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0e1626;border:1px solid #263552;border-radius:9px;padding:9px 11px;font-size:0.82rem;color:#f1f5f9;cursor:pointer;text-align:left;}.opt-btn.active{background:rgba(16,185,129,0.16);border-color:#10b981;}.opt-left{display:flex;align-items:center;gap:8px;}.check-box{width:17px;height:17px;border-radius:5px;border:1.5px solid #64748b;display:inline-flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:900;flex-shrink:0;}.opt-btn.active .check-box{background:#10b981;border-color:#10b981;color:#052e16;}.opt-price{font-weight:800;color:#10b981;white-space:nowrap;}.opt-pending{font-weight:700;color:#fbbf24;font-size:0.76rem;}.qty-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:6px 8px;background:#090e1a;border-radius:8px;border:1px solid #1e293b;font-size:0.78rem;}.qty-controls{display:flex;align-items:center;gap:6px;}.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid #334155;background:#151d30;color:#fff;font-weight:800;cursor:pointer;}.qty-val{min-width:20px;text-align:center;font-weight:800;color:#34d399;}.empty{text-align:center;padding:36px 16px;color:#94a3b8;background:#151d30;border-radius:12px;border:1px dashed #334155;}.cart-bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;border-top:1px solid #24324d;padding:10px 14px;z-index:40;display:none;}.cart-bar.show{display:block;}.cart-inner{max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;}.cart-sum{font-size:0.85rem;}.cart-sum strong{color:#10b981;font-size:1rem;}.cart-btns{display:flex;gap:8px;flex-wrap:wrap;}.btn-sec{background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:9px;padding:8px 12px;font-size:0.8rem;font-weight:700;cursor:pointer;}.btn-copy{background:#10b981;color:#052e16;border:none;border-radius:9px;padding:9px 14px;font-size:0.82rem;font-weight:800;cursor:pointer;}.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.82);display:none;align-items:center;justify-content:center;padding:14px;z-index:60;}.modal-backdrop.open{display:flex;}.modal{width:100%;max-width:520px;background:#151d30;border:1px solid #334155;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto;}.modal-title{font-size:1.05rem;font-weight:800;color:#fff;}.summary-box{width:100%;min-height:190px;background:#0b1220;border:1px solid #24324d;border-radius:10px;padding:10px;color:#e2e8f0;font-size:0.82rem;line-height:1.45;resize:vertical;}.toast{position:fixed;top:16px;right:16px;background:#10b981;color:#052e16;font-weight:800;font-size:0.82rem;padding:10px 14px;border-radius:10px;z-index:80;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);}.toast.show{display:block;}</style></head><body><div class="toast" id="toast">Resumo copiado para enviar no WhatsApp!</div><div class="wrap"><div class="header"><div><span class="brand-tag">Atendimento &amp; Pedidos</span><h1>Catálogo de Produtos</h1><div class="sub" id="counter">Carregando...</div></div><div class="header-actions"><div class="pill-info" id="topSelCount">0 selecionados</div><button class="btn-top-copy" id="topCopyBtn" onclick="openSummary()" disabled>Copiar para WhatsApp</button></div></div><div class="search-box"><input id="q" class="search-input" type="search" placeholder="Buscar produto, finalidade, dosagem ou categoria..." oninput="render()" /></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none;">Nenhum item encontrado.</div></div><div class="cart-bar" id="cartBar"><div class="cart-inner"><div class="cart-sum"><span id="barCount">0 itens</span> • Estimado: <strong id="barTotal">R$ 0,00</strong></div><div class="cart-btns"><button class="btn-sec" onclick="clearSel()">Limpar</button><button class="btn-copy" onclick="openSummary()">Copiar / Enviar WhatsApp</button></div></div></div><div class="modal-backdrop" id="modalBackdrop" onclick="closeSummary(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title">Resumo Selecionado para WhatsApp</div><div class="sub">Confira os itens selecionados e copie a mensagem pronta para colar no WhatsApp:</div><textarea class="summary-box" id="summaryText" readonly></textarea><div class="cart-btns" style="justify-content: flex-end;"><button class="btn-sec" onclick="closeSummary()">Fechar</button><button class="btn-copy" onclick="copySummary()">Copiar Texto</button></div></div></div><script>const ITEMS=[{id:"far-roacutam-20",cat:"Farmácia",name:"Roacutam 20mg (30cp)",desc:"Indicado no tratamento de acne severa/resistente e controle de oleosidade excessiva da pele, sob acompanhamento médico.",options:[{label:"Caixa (30cp)",priceText:"R$ 210,00",num:210}]},{id:"far-sibutramina-15",cat:"Farmácia",name:"Sibutramina 15mg (30cp)",desc:"Auxilia no emagrecimento e controle do apetite/saciedade associado a dieta e rotina de exercícios.",options:[{label:"Caixa (30cp)",priceText:"R$ 110,00",num:110}]},{id:"far-tadala-20",cat:"Farmácia",name:"Tadala Eurofarma 20mg (4cp)",desc:"Favorece a vasodilatação e o fluxo sanguíneo; utilizada pontualmente para performance sexual e suporte de circulação/pump.",options:[{label:"Caixa / Cartela (4cp)",priceText:"R$ 25,00",num:25}]},{id:"far-tadala-5",cat:"Farmácia",name:"Tadala Eurofarma 5mg (30cp)",desc:"Uso diário de baixa dose para vasodilatação contínua, melhora da circulação, suporte erétil e auxílio em quadros prostáticos leves.",options:[{label:"Caixa (30cp)",priceText:"R$ 25,00",num:25}]},{id:"far-venv-coop-30",cat:"Farmácia",name:"Venvanse Cooper Manipulado 30mg (30caps)",desc:"Estimulante do sistema nervoso central (lisdexanfetamina) voltado a foco, atenção e controle de compulsão/impulsividade conforme prescrição.",options:[{label:"Pote (30caps)",priceText:"R$ 410,00",num:410}]},{id:"far-venv-coop-70",cat:"Farmácia",name:"Venvanse Cooper Manipulado 70mg (30caps)",desc:"Concentração mais alta de lisdexanfetamina para foco prolongado, atenção e energia mental sob orientação profissional.",options:[{label:"Pote (30caps)",priceText:"R$ 530,00",num:530}]},{id:"far-venv-lisp-30",cat:"Farmácia",name:"Venvanse Lispax 30mg (30caps)",desc:"Lisdexanfetamina 30mg voltada ao suporte de atenção, foco e produtividade cognitiva conforme indicação.",options:[{label:"Caixa / Pote (30caps)",priceText:"R$ 410,00",num:410}]},{id:"far-venv-lisp-50",cat:"Farmácia",name:"Venvanse Lispax 50mg (30caps)",desc:"Lisdexanfetamina 50mg para foco sustentado e controle de atenção ao longo do dia sob acompanhamento.",options:[{label:"Caixa / Pote (30caps)",priceText:"R$ 510,00",num:510}]},{id:"far-finasterida-1",cat:"Farmácia",name:"Finasterida 1mg (30cp)",desc:"Atua na redução da conversão de testosterona em DHT, auxiliando na prevenção e controle da queda capilar androgenética.",options:[{label:"Caixa (30cp)",priceText:"R$ 60,00",num:60}]},{id:"far-hgh-10",cat:"Farmácia",name:"HGH Kigtropin 10ui",desc:"Hormônio do crescimento (somatropina) associado a recuperação tecidual, composição corporal e suporte metabólico.",options:[{label:"Frasco (10 UI)",priceText:"R$ 75,00",num:75}]},{id:"far-lipoless",cat:"Farmácia",name:"Lipoless",desc:"Protocolo/apresentação voltada ao suporte de redução de gordura localizada e remodelação corporal.",options:[{label:"Kit / Apresentação",priceText:"R$ 1.150,00",num:1150}]},{id:"far-lipostabil-5",cat:"Farmácia",name:"Lipostabil 5ML",desc:"Solução voltada a protocolos estéticos e metabólicos de apoio na redução de gordura localizada.",options:[{label:"Unidade (5 mL)",priceText:"R$ 60,00",num:60}]},{id:"kp-deca-200",cat:"King Pharma",name:"Deca 10ML - 200mg",desc:"Decanoato de nandrolona (200mg/mL, 10 mL): usado em fases de ganho de massa muscular e conforto articular durante treinos pesados.",options:[{label:"Frasco (10 mL)",priceText:"R$ 190,00",num:190}]},{id:"kp-dianabol-10",cat:"King Pharma",name:"Dianabol 10mg (100cp)",desc:"Metandrostenolona oral (10mg, 100cp): utilizada para ganho rápido de força, volume muscular e retenção intracelular em ciclos curtos.",options:[{label:"Frasco / Caixa (100cp)",priceText:"R$ 145,00",num:145}]},{id:"kp-durateston-250",cat:"King Pharma",name:"Durateston 250mg/ml",desc:"Blend de ésteres de testosterona (250mg/mL, 10 mL): mantém níveis hormonais estáveis para força, massa muscular e recuperação.",options:[{label:"Frasco (10 mL)",priceText:"R$ 210,00",num:210}]},{id:"kp-enantato-250",cat:"King Pharma",name:"Enantato 250mg/ml",desc:"Enantato de testosterona King Pharma (250mg/mL, 10 mL): base hormonal para ganho de força, massa magra, libido e recuperação.",options:[{label:"Frasco (10 mL)",priceText:"R$ 180,00",num:180}]},{id:"kp-hemogenin-20",cat:"King Pharma",name:"Hemogenin 50mg (20cp)",desc:"Oximetolona oral (50mg, 20cp): potente recurso para aumento rápido de força, densidade/volume e estímulo de apetite.",options:[{label:"Caixa / Cartela (20cp)",priceText:"R$ 145,00",num:145}]},{id:"kp-hemogenin-50",cat:"King Pharma",name:"Hemogenin 50mg (50cp)",desc:"Oximetolona oral (50mg, 50cp): versão maior para protocolos de ganho expressivo de força e volume muscular.",options:[{label:"Caixa / Cartela (50cp)",priceText:"R$ 220,00",num:220}]},{id:"kp-masteron-100",cat:"King Pharma",name:"Masteron 100mg/ml",desc:"Drostanolona injetável (100mg/mL): buscada para aspecto seco, dureza muscular e definição em fases de cutting ou finalização.",options:[{label:"Frasco",priceText:"Sob consulta / Pendente",num:null,pending:true}]},{id:"kp-masteron-en-100",cat:"King Pharma",name:"Masteron Enantato 100mg/ml",desc:"Enantato de drostanolona (100mg/mL): éster de ação mais espaçada voltado a qualidade muscular, rigidez e definição.",options:[{label:"Frasco (10 mL)",priceText:"R$ 275,00",num:275}]},{id:"kp-masteron-oral-10",cat:"King Pharma",name:"Masteron Oral 10mg (50cp)",desc:"Drostanolona em comprimidos (10mg, 50cp): alternativa oral para refinamento físico, dureza e vascularização.",options:[{label:"Frasco / Caixa (50cp)",priceText:"R$ 215,00",num:215}]},{id:"kp-oxan-10",cat:"King Pharma",name:"Oxandrolona 10mg (50cp)",desc:"Oxandrolona oral (10mg, 50cp): conhecida pelo ganho de força e massa magra com menor retenção hídrica.",options:[{label:"Frasco / Caixa (50cp)",priceText:"R$ 230,00",num:230}]},{id:"kp-primo-100",cat:"King Pharma",name:"Primobolan 100mg/ml",desc:"Enantato de metenolona (100mg/mL): foco em ganhos graduais de massa limpa, qualidade muscular e preservação em déficit.",options:[{label:"Frasco (10 mL)",priceText:"R$ 420,00",num:420}]},{id:"kp-trembo-ace-100",cat:"King Pharma",name:"Trembo Ace 10ML - 100mg",desc:"Acetato de trembolona (100mg/mL, 10 mL): alta potência anabólica voltada a força, densidade muscular e recomposição avançada.",options:[{label:"Frasco (10 mL)",priceText:"R$ 195,00",num:195}]},{id:"ld-enantato-testo",cat:"Lander / Landerlan",name:"Enantato Testo",desc:"Enantato de testosterona Lander / Landerlan: base hormonal para força, massa muscular, recuperação e desempenho.",options:[{label:"Frasco",priceText:"R$ 230,00",num:230}]},{id:"ld-oxan-10-50",cat:"Lander / Landerlan",name:"Oxan 10mg (50comp)",desc:"Oxandrolona 10mg (50 comp) Lander / Landerlan: suporte de força, resistência e massa magra com aspecto seco.",options:[{label:"Frasco / Caixa (50comp)",priceText:"R$ 300,00",num:300}]},{id:"ld-oxan-5-100",cat:"Lander / Landerlan",name:"Oxan 5mg (100comp)",desc:"Oxandrolona 5mg (100 comp) Lander / Landerlan: facilita fracionamento e ajuste gradual de doses ao longo do dia.",options:[{label:"Frasco / Caixa (100comp)",priceText:"R$ 370,00",num:370}]},{id:"ld-proviron-25",cat:"Lander / Landerlan",name:"Proviron 25mcg (20cp)",desc:"Mesterolona (20cp): usada para suporte androgênico, dureza muscular, libido e apoio em protocolos.",options:[{label:"Caixa / Cartela (20cp)",priceText:"R$ 185,00",num:185}]},{id:"ld-stano-oral-10",cat:"Lander / Landerlan",name:"Stano Oral 10mg (100cp)",desc:"Estanozolol oral 10mg (100cp): voltado a ganho de força, definição muscular e redução de aspecto inchado.",options:[{label:"Frasco / Caixa (100cp)",priceText:"R$ 165,00",num:165}]},{id:"ld-dianabol-10",cat:"Lander / Landerlan",name:"Dianabol 10mg (100cp)",desc:"Metandrostenolona 10mg (100cp) Lander / Landerlan: ganho rápido de força e volume muscular.",options:[{label:"Frasco / Caixa (100cp)",priceText:"R$ 175,00",num:175}]},{id:"ld-hemogenin-20",cat:"Lander / Landerlan",name:"Hemogenin 50mg (20cp)",desc:"Oximetolona 50mg (20cp) Lander / Landerlan: aumento acelerado de força e peso/volume em protocolos específicos.",options:[{label:"Caixa / Cartela (20cp)",priceText:"R$ 175,00",num:175}]},{id:"nv-pt141",cat:"Novax",name:"PT-141 (10mg + 2ml Água Bac)",desc:"Peptídeo bremelanotide (10mg + 2 mL água bacteriostática): atua no sistema nervoso central para estímulo do desejo/resposta sexual. Até 10 aplicações fracionadas de 1 mg (20 UI) por frasco. Usar seringa estéril nova a cada aplicação e manter refrigerado após diluir.",options:[{label:"Frasco / Kit Completo (10 mg + 2 mL)",priceText:"R$ 550,00",num:550},{label:"Aplicação Fracionada / Dose (1 mg / 20 UI)",priceText:"R$ 100,00",num:100}]}];let activeCat="Todos";const selected=new Map();function fmtBRL(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}function renderCats(){const cats=["Todos",...new Set(ITEMS.map(i=>i.cat))];const el=document.getElementById("cats");el.innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="cat-btn"+(c===activeCat?" active":"");b.textContent=c;b.onclick=()=>{activeCat=c;renderCats();render();};el.appendChild(b);});}function toggleOpt(key){if(selected.has(key)){selected.delete(key);}else{selected.set(key,1);}updateCartUI();render();}function changeQty(key,delta,e){e.stopPropagation();const cur=selected.get(key)||0;const next=cur+delta;if(next<=0){selected.delete(key);}else{selected.set(key,next);}updateCartUI();render();}function clearSel(){selected.clear();updateCartUI();render();}function getSelectedDetails(){const list=[];for(const[key,qty]of selected.entries()){const[itemId,idxStr]=key.split("::");const optIdx=Number(idxStr);const item=ITEMS.find(i=>i.id===itemId);if(!item||!item.options[optIdx])continue;const opt=item.options[optIdx];list.push({key,item,opt,qty});}return list;}function updateCartUI(){const list=getSelectedDetails();const totalQty=list.reduce((acc,x)=>acc+x.qty,0);let totalNum=0;let hasPending=false;list.forEach(x=>{if(typeof x.opt.num==="number")totalNum+=x.opt.num*x.qty;else hasPending=true;});const topCount=document.getElementById("topSelCount");const topBtn=document.getElementById("topCopyBtn");topCount.textContent=totalQty===1?"1 selecionado":`${totalQty} selecionados`;topBtn.disabled=totalQty===0;const bar=document.getElementById("cartBar");if(totalQty===0){bar.classList.remove("show");}else{bar.classList.add("show");document.getElementById("barCount").textContent=totalQty===1?"1 item":`${totalQty} itens`;document.getElementById("barTotal").textContent=fmtBRL(totalNum)+(hasPending?" + sob consulta":"");}}function buildSummaryMessage(){const list=getSelectedDetails();if(!list.length)return "";const lines=["Olá! Gostaria de verificar/pedir os seguintes itens do catálogo:",""];let totalNum=0;let hasPending=false;list.forEach((x,idx)=>{const unit=typeof x.opt.num==="number"?fmtBRL(x.opt.num):x.opt.priceText;const lineSub=typeof x.opt.num==="number"?` (${fmtBRL(x.opt.num * x.qty)})`:"";if(typeof x.opt.num==="number")totalNum+=x.opt.num*x.qty;else hasPending=true;lines.push(`${idx + 1}. [${x.item.cat}] ${x.item.name} — ${x.opt.label} | Qtd: ${x.qty} | ${unit}${lineSub}`);});lines.push("");lines.push(`Total estimado: ${fmtBRL(totalNum)}${hasPending ? " (há item sob consulta)" : ""}`);return lines.join("\n");}function openSummary(){const msg=buildSummaryMessage();if(!msg)return;document.getElementById("summaryText").value=msg;document.getElementById("modalBackdrop").classList.add("open");}function closeSummary(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("modalBackdrop").classList.remove("open");}async function copySummary(){const txt=document.getElementById("summaryText").value;if(!txt)return;try{await navigator.clipboard.writeText(txt);showToast("Resumo copiado! Agora é só colar no WhatsApp.");}catch(_){const ta=document.getElementById("summaryText");ta.focus();ta.select();document.execCommand("copy");showToast("Resumo copiado! Agora é só colar no WhatsApp.");}}function render(){const q=document.getElementById("q").value.trim().toLowerCase();const list=ITEMS.filter(i=>{const okCat=activeCat==="Todos"||i.cat===activeCat;const okQ=!q||i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q)||i.options.some(o=>o.label.toLowerCase().includes(q)||o.priceText.toLowerCase().includes(q));return okCat&&okQ;});document.getElementById("counter").textContent=`Exibindo ${list.length} de ${ITEMS.length} itens`;const grid=document.getElementById("grid");const empty=document.getElementById("empty");if(!list.length){grid.innerHTML="";empty.style.display="block";return;}empty.style.display="none";grid.innerHTML=list.map(i=>{const anySel=i.options.some((_,idx)=>selected.has(`${i.id}::${idx}`));const optsHtml=i.options.map((o,idx)=>{const key=`${i.id}::${idx}`;const qty=selected.get(key)||0;const isAct=qty>0;const qtyBlock=isAct?`            <div class="qty-row" onclick="event.stopPropagation()">              <span>Quantidade selecionada:</span>              <div class="qty-controls">                <button class="qty-btn" onclick="changeQty('${key}', -1, event)">-</button>                <span class="qty-val">${qty}</span>                <button class="qty-btn" onclick="changeQty('${key}', 1, event)">+</button>              </div>            </div>          `:"";return `            <div>              <button type="button" class="opt-btn ${isAct ? "active" : ""}" onclick="toggleOpt('${key}')">                <span class="opt-left">                  <span class="check-box">${isAct ? "✓" : ""}</span>                  <span>${o.label}</span>                </span>                <span class="${o.pending ? "opt-pending" : "opt-price"}">${o.priceText}</span>              </button>              ${qtyBlock}            </div>          `;}).join("");return `          <div class="card ${anySel ? "selected-card" : ""}">            <div>              <span class="badge">${i.cat}</span>              <div class="title">${i.name}</div>              <div class="desc">${i.desc}</div>            </div>            <div class="opts">${optsHtml}</div>          </div>        `;}).join("");}renderCats();updateCartUI();render();</script></body></html>
